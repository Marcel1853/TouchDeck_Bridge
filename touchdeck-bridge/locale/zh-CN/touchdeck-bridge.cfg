[mod-name]
touchdeck-bridge=TouchDeck Bridge

[mod-description]
touchdeck-bridge=将 Factorio 连接到 TouchDeck（手机或平板电脑作为遥控器）：把游戏状态写入 script-output 中的 JSON 文件，并通过自身的快捷键接收命令。无需启动参数，无需网络。

[mod-setting-name]
touchdeck-bridge-interval=每隔 … 刻写入状态
touchdeck-bridge-enabled=为 TouchDeck 写入文件

[mod-setting-description]
touchdeck-bridge-interval=state.json 的更新频率（60 刻 = 1 秒）。事件和命令会立即写入。
touchdeck-bridge-enabled=关闭后，模组不会为你写入文件（例如在多人游戏中你不使用 TouchDeck 时）。

[controls]
touchdeck-bridge-command=TouchDeck：打开命令栏
touchdeck-bridge-pause=TouchDeck：切换暂停
touchdeck-bridge-speed-1=TouchDeck：速度 0.5×
touchdeck-bridge-speed-2=TouchDeck：速度 1×
touchdeck-bridge-speed-3=TouchDeck：速度 2×
touchdeck-bridge-speed-4=TouchDeck：速度 4×
touchdeck-bridge-slower=TouchDeck：减速（一半）
touchdeck-bridge-faster=TouchDeck：加速（两倍）
touchdeck-bridge-save=TouchDeck：保存游戏
touchdeck-bridge-screenshot=TouchDeck：截图
touchdeck-bridge-cancel-research=TouchDeck：取消研究
touchdeck-bridge-research-1=TouchDeck：将研究建议 1 加入队列
touchdeck-bridge-research-2=TouchDeck：将研究建议 2 加入队列
touchdeck-bridge-research-3=TouchDeck：将研究建议 3 加入队列
touchdeck-bridge-center=TouchDeck：回到玩家
touchdeck-bridge-refresh=TouchDeck：重新写入数据
touchdeck-bridge-utl-manager=TouchDeck：打开 UTL 管理器（仅限 UTLogistics）
touchdeck-bridge-utl-alerts=TouchDeck：UTL 管理器，警报（仅限 UTLogistics）

[touchdeck-bridge]
command-title=TouchDeck 命令
command-help=TouchDeck Bridge 命令，例如 /touchdeck speed 2、/touchdeck research #1、/touchdeck pause
utl-tab=TouchDeck
utl-section=TouchDeck
utl-pin=在 TouchDeck 上显示
utl-pin-tooltip=在 TouchDeck 页面“UTLogistics › 车站”上显示此车站（在站和途中的列车、供应、需求）。随蓝图和复制设置一同保留。
utl-slot=位置 __1__
utl-tab-count=已用 __1__ / __2__ 个位置
utl-tab-hint=固定车站：车站窗口 › TouchDeck › 勾选并选择位置。
utl-tab-empty=尚未固定任何车站。
utl-col-slot=位置
utl-col-station=车站
utl-col-surface=星球
utl-col-network=网络
utl-col-trains=列车
utl-col-action=
utl-trains=__1__ 在站 · __2__ 途中
utl-goto=在地图上显示车站
utl-unpin=取消固定

[touchdeck-bridge-msg]
paused=游戏已暂停
resumed=游戏已继续
speed=速度 __1__×
saved=已保存：__1__
screenshot=截图：__1__
research-queued=已加入队列：__1__
research-cancelled=已取消研究：__1__
centered=已回到玩家
refreshed=已重新写入数据
bad-value=无效的值：__1__
bad-speed=速度必须在 0.01 到 100 之间：__1__
research-unknown=未找到研究：__1__
research-done=已研究：__1__
research-failed=无法加入队列：__1__
no-suggestion=没有研究建议 __1__（目前无可加入队列的研究）
no-research=当前没有进行中的研究
no-player=仅在有玩家时可用
not-admin=仅限管理员（多人游戏）
