[mod-name]
touchdeck-bridge=TouchDeck Bridge

[mod-description]
touchdeck-bridge=Verbindet Factorio mit TouchDeck (Handy oder Tablet als Fernbedienung): schreibt den Spielzustand als JSON-Datei nach script-output und nimmt Befehle über eigene Tastenkürzel an. Keine Startoptionen, kein Netzwerk.

[mod-setting-name]
touchdeck-bridge-interval=Zustand schreiben alle … Ticks
touchdeck-bridge-enabled=Für TouchDeck schreiben

[mod-setting-description]
touchdeck-bridge-interval=Wie oft state.json aktualisiert wird (60 Ticks = 1 Sekunde). Ereignisse und Befehle werden sofort geschrieben.
touchdeck-bridge-enabled=Wenn aus, schreibt der Mod für dich keine Dateien (z. B. im Mehrspieler, wenn du TouchDeck nicht nutzt).

