[mod-name]
touchdeck-bridge=TouchDeck Bridge

[mod-description]
touchdeck-bridge=Łączy Factorio z TouchDeck (telefon lub tablet jako pilot): zapisuje stan gry do pliku JSON w script-output i przyjmuje polecenia przez własne skróty klawiszowe. Bez opcji uruchamiania, bez sieci.

[mod-setting-name]
touchdeck-bridge-interval=Zapisuj stan co … ticków
touchdeck-bridge-enabled=Zapisuj pliki dla TouchDeck

[mod-setting-description]
touchdeck-bridge-interval=Jak często aktualizowany jest state.json (60 ticków = 1 sekunda). Zdarzenia i polecenia są zapisywane od razu.
touchdeck-bridge-enabled=Gdy wyłączone, mod nie zapisuje dla ciebie plików (np. w trybie wieloosobowym, jeśli nie używasz TouchDeck).

