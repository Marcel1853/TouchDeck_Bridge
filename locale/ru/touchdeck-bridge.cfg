[mod-name]
touchdeck-bridge=TouchDeck Bridge

[mod-description]
touchdeck-bridge=Связывает Factorio с TouchDeck (телефон или планшет как пульт): записывает состояние игры в JSON-файл в script-output и принимает команды через собственные сочетания клавиш. Без параметров запуска, без сети.

[mod-setting-name]
touchdeck-bridge-interval=Записывать состояние каждые … тиков
touchdeck-bridge-enabled=Записывать файлы для TouchDeck

[mod-setting-description]
touchdeck-bridge-interval=Как часто обновляется state.json (60 тиков = 1 секунда). События и команды записываются сразу.
touchdeck-bridge-enabled=Если выключено, мод не записывает для вас файлы (например, в мультиплеере, если вы не используете TouchDeck).

[controls]
touchdeck-bridge-command=TouchDeck: открыть поле команд
touchdeck-bridge-pause=TouchDeck: пауза вкл./выкл.
touchdeck-bridge-speed-1=TouchDeck: скорость 0,5×
touchdeck-bridge-speed-2=TouchDeck: скорость 1×
touchdeck-bridge-speed-3=TouchDeck: скорость 2×
touchdeck-bridge-speed-4=TouchDeck: скорость 4×
touchdeck-bridge-slower=TouchDeck: медленнее (вдвое)
touchdeck-bridge-faster=TouchDeck: быстрее (вдвое)
touchdeck-bridge-save=TouchDeck: сохранить игру
touchdeck-bridge-screenshot=TouchDeck: снимок экрана
touchdeck-bridge-cancel-research=TouchDeck: отменить исследование
touchdeck-bridge-research-1=TouchDeck: в очередь предложение исследования 1
touchdeck-bridge-research-2=TouchDeck: в очередь предложение исследования 2
touchdeck-bridge-research-3=TouchDeck: в очередь предложение исследования 3
touchdeck-bridge-center=TouchDeck: вернуться к игроку
touchdeck-bridge-refresh=TouchDeck: записать данные заново
touchdeck-bridge-utl-manager=TouchDeck: открыть менеджер UTL (только с UTLogistics)
touchdeck-bridge-utl-alerts=TouchDeck: менеджер UTL, предупреждения (только с UTLogistics)

