[mod-name]
touchdeck-bridge=TouchDeck Bridge

[mod-description]
touchdeck-bridge=Connects Factorio to TouchDeck (phone or tablet as a remote control): writes the game state as a JSON file to script-output and takes commands through its own key bindings. No launch options, no network.

[mod-setting-name]
touchdeck-bridge-interval=Write state every … ticks
touchdeck-bridge-enabled=Write files for TouchDeck

[mod-setting-description]
touchdeck-bridge-interval=How often state.json is updated (60 ticks = 1 second). Events and commands are written at once.
touchdeck-bridge-enabled=When off, the mod writes no files for you (for example in multiplayer if you do not use TouchDeck).

[controls]
touchdeck-bridge-command=TouchDeck: open command field
touchdeck-bridge-pause=TouchDeck: toggle pause
touchdeck-bridge-speed-1=TouchDeck: speed 0.5×
touchdeck-bridge-speed-2=TouchDeck: speed 1×
touchdeck-bridge-speed-3=TouchDeck: speed 2×
touchdeck-bridge-speed-4=TouchDeck: speed 4×
touchdeck-bridge-slower=TouchDeck: slower (half speed)
touchdeck-bridge-faster=TouchDeck: faster (double speed)
touchdeck-bridge-save=TouchDeck: save game
touchdeck-bridge-screenshot=TouchDeck: screenshot
touchdeck-bridge-cancel-research=TouchDeck: cancel research
touchdeck-bridge-research-1=TouchDeck: queue research suggestion 1
touchdeck-bridge-research-2=TouchDeck: queue research suggestion 2
touchdeck-bridge-research-3=TouchDeck: queue research suggestion 3
touchdeck-bridge-center=TouchDeck: back to the player
touchdeck-bridge-refresh=TouchDeck: write data again
touchdeck-bridge-utl-manager=TouchDeck: open UTL manager (UTLogistics only)
touchdeck-bridge-utl-alerts=TouchDeck: UTL manager, alerts (UTLogistics only)

