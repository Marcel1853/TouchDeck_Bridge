[mod-name]
touchdeck-bridge=TouchDeck Bridge

[mod-description]
touchdeck-bridge=Relie Factorio à TouchDeck (téléphone ou tablette comme télécommande) : écrit l'état du jeu dans un fichier JSON dans script-output et reçoit des commandes par ses propres raccourcis clavier. Sans option de lancement, sans réseau.

[mod-setting-name]
touchdeck-bridge-interval=Écrire l'état tous les … ticks
touchdeck-bridge-enabled=Écrire les fichiers pour TouchDeck

[mod-setting-description]
touchdeck-bridge-interval=Fréquence de mise à jour de state.json (60 ticks = 1 seconde). Les événements et commandes sont écrits immédiatement.
touchdeck-bridge-enabled=Désactivé, le mod n'écrit aucun fichier pour vous (par exemple en multijoueur si vous n'utilisez pas TouchDeck).

[controls]
touchdeck-bridge-command=TouchDeck : ouvrir le champ de commande
touchdeck-bridge-pause=TouchDeck : pause/reprise
touchdeck-bridge-speed-1=TouchDeck : vitesse 0,5×
touchdeck-bridge-speed-2=TouchDeck : vitesse 1×
touchdeck-bridge-speed-3=TouchDeck : vitesse 2×
touchdeck-bridge-speed-4=TouchDeck : vitesse 4×
touchdeck-bridge-slower=TouchDeck : plus lent (moitié)
touchdeck-bridge-faster=TouchDeck : plus vite (double)
touchdeck-bridge-save=TouchDeck : sauvegarder
touchdeck-bridge-screenshot=TouchDeck : capture d'écran
touchdeck-bridge-cancel-research=TouchDeck : annuler la recherche
touchdeck-bridge-research-1=TouchDeck : ajouter la suggestion de recherche 1
touchdeck-bridge-research-2=TouchDeck : ajouter la suggestion de recherche 2
touchdeck-bridge-research-3=TouchDeck : ajouter la suggestion de recherche 3
touchdeck-bridge-center=TouchDeck : retour au joueur
touchdeck-bridge-refresh=TouchDeck : réécrire les données
touchdeck-bridge-utl-manager=TouchDeck : ouvrir le gestionnaire UTL (UTLogistics uniquement)
touchdeck-bridge-utl-alerts=TouchDeck : gestionnaire UTL, alertes (UTLogistics uniquement)

