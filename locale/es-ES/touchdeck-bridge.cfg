[mod-name]
touchdeck-bridge=TouchDeck Bridge

[mod-description]
touchdeck-bridge=Conecta Factorio con TouchDeck (móvil o tableta como mando a distancia): escribe el estado del juego en un archivo JSON en script-output y recibe órdenes mediante sus propios atajos de teclado. Sin opciones de inicio, sin red.

[mod-setting-name]
touchdeck-bridge-interval=Escribir el estado cada … ticks
touchdeck-bridge-enabled=Escribir archivos para TouchDeck

[mod-setting-description]
touchdeck-bridge-interval=Con qué frecuencia se actualiza state.json (60 ticks = 1 segundo). Los eventos y órdenes se escriben al instante.
touchdeck-bridge-enabled=Si está desactivado, el mod no escribe archivos para ti (por ejemplo en multijugador si no usas TouchDeck).

[controls]
touchdeck-bridge-command=TouchDeck: abrir campo de órdenes
touchdeck-bridge-pause=TouchDeck: pausar/reanudar
touchdeck-bridge-speed-1=TouchDeck: velocidad 0,5×
touchdeck-bridge-speed-2=TouchDeck: velocidad 1×
touchdeck-bridge-speed-3=TouchDeck: velocidad 2×
touchdeck-bridge-speed-4=TouchDeck: velocidad 4×
touchdeck-bridge-slower=TouchDeck: más lento (mitad)
touchdeck-bridge-faster=TouchDeck: más rápido (doble)
touchdeck-bridge-save=TouchDeck: guardar partida
touchdeck-bridge-screenshot=TouchDeck: captura de pantalla
touchdeck-bridge-cancel-research=TouchDeck: cancelar investigación
touchdeck-bridge-research-1=TouchDeck: poner en cola la sugerencia de investigación 1
touchdeck-bridge-research-2=TouchDeck: poner en cola la sugerencia de investigación 2
touchdeck-bridge-research-3=TouchDeck: poner en cola la sugerencia de investigación 3
touchdeck-bridge-center=TouchDeck: volver al jugador
touchdeck-bridge-refresh=TouchDeck: volver a escribir datos
touchdeck-bridge-utl-manager=TouchDeck: abrir gestor de UTL (solo con UTLogistics)
touchdeck-bridge-utl-alerts=TouchDeck: gestor de UTL, avisos (solo con UTLogistics)

