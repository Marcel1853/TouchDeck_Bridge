[mod-name]
touchdeck-bridge=TouchDeck Bridge

[mod-description]
touchdeck-bridge=Conecta o Factorio ao TouchDeck (celular ou tablet como controle remoto): grava o estado do jogo em um arquivo JSON em script-output e recebe comandos pelos próprios atalhos de teclado. Sem opções de inicialização, sem rede.

[mod-setting-name]
touchdeck-bridge-interval=Gravar o estado a cada … ticks
touchdeck-bridge-enabled=Gravar arquivos para o TouchDeck

[mod-setting-description]
touchdeck-bridge-interval=Com que frequência o state.json é atualizado (60 ticks = 1 segundo). Eventos e comandos são gravados na hora.
touchdeck-bridge-enabled=Desligado, o mod não grava arquivos para você (por exemplo no multijogador, se você não usa o TouchDeck).

[controls]
touchdeck-bridge-command=TouchDeck: abrir campo de comando
touchdeck-bridge-pause=TouchDeck: pausar/retomar
touchdeck-bridge-speed-1=TouchDeck: velocidade 0,5×
touchdeck-bridge-speed-2=TouchDeck: velocidade 1×
touchdeck-bridge-speed-3=TouchDeck: velocidade 2×
touchdeck-bridge-speed-4=TouchDeck: velocidade 4×
touchdeck-bridge-slower=TouchDeck: mais devagar (metade)
touchdeck-bridge-faster=TouchDeck: mais rápido (dobro)
touchdeck-bridge-save=TouchDeck: salvar jogo
touchdeck-bridge-screenshot=TouchDeck: captura de tela
touchdeck-bridge-cancel-research=TouchDeck: cancelar pesquisa
touchdeck-bridge-research-1=TouchDeck: enfileirar sugestão de pesquisa 1
touchdeck-bridge-research-2=TouchDeck: enfileirar sugestão de pesquisa 2
touchdeck-bridge-research-3=TouchDeck: enfileirar sugestão de pesquisa 3
touchdeck-bridge-center=TouchDeck: voltar ao jogador
touchdeck-bridge-refresh=TouchDeck: gravar dados novamente
touchdeck-bridge-utl-manager=TouchDeck: abrir gerenciador UTL (só com UTLogistics)
touchdeck-bridge-utl-alerts=TouchDeck: gerenciador UTL, alertas (só com UTLogistics)

